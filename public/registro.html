<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Castellers · Registre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#EAE6DA; --paper-card:#F1EEE4; --ink:#20241F; --ink-soft:#4B5049; --thread:#9E2B3B; --gold:#B8893D; --line:#C7C2B0; --ok:#3E7A4E; --radius:3px; }
  * { box-sizing: border-box; }
  body { margin:0; background: linear-gradient(var(--line) 1px, transparent 1px) 0 0/100% 34px, var(--paper); color:var(--ink); font-family:'Work Sans',sans-serif; font-size:15px; line-height:1.5; }
  a { color: var(--thread); }
  main { max-width: 440px; margin: 60px auto; padding: 0 20px; }
  .brand { display:flex; align-items:center; gap:10px; font-family:'Fraunces',serif; font-weight:700; font-size:20px; text-decoration:none; color:var(--ink); font-variant:small-caps; margin-bottom:26px; justify-content:center; }
  section.panel { background: var(--paper-card); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px 24px; }
  h1 { font-family:'Fraunces',serif; font-weight:700; font-size:22px; margin:0 0 6px; text-align:center; }
  p.lead { color: var(--ink-soft); font-size:13px; text-align:center; margin:0 0 22px; }
  label { display:block; font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); margin:14px 0 4px; }
  label:first-of-type { margin-top:0; }
  input { width:100%; padding:10px 11px; border:1px solid var(--line); background:var(--paper); border-radius:var(--radius); font-family:'Work Sans',sans-serif; font-size:14px; }
  button { width:100%; cursor:pointer; border:none; border-radius:var(--radius); font-family:'IBM Plex Mono',monospace; font-size:12.5px; letter-spacing:0.04em; text-transform:uppercase; padding:12px 16px; margin-top:20px; }
  button.primary { background: var(--thread); color: var(--paper-card); }
  button.primary:hover { background:#862432; }
  button:disabled { opacity:0.5; }
  .msg { margin-top:14px; padding:10px 12px; border-radius:var(--radius); font-size:13px; display:none; }
  .msg.ok { display:block; background:#E4EEE6; border:1px solid var(--ok); color:var(--ok); }
  .msg.error { display:block; background:#F3E7E5; border:1px solid var(--thread); color:var(--thread); }
  .foot-link { text-align:center; margin-top:18px; font-size:13px; color:var(--ink-soft); }

  .lang-switcher { position:fixed; top:14px; right:14px; display:flex; gap:6px; z-index:50; }
  .lang-btn { width:auto; margin:0; padding:5px 7px; background:var(--paper-card); border:1.5px solid var(--line); border-radius:var(--radius); font-size:15px; line-height:1; display:flex; align-items:center; justify-content:center; }
  .lang-btn.active { border-color: var(--ink); }
  .lang-btn svg { display:block; border-radius:1px; }
</style>
</head>
<body>

<div class="lang-switcher">
  <button class="lang-btn" data-lang="ca" title="Català" type="button">
    <svg width="20" height="14" viewBox="0 0 20 14"><rect width="20" height="14" fill="#FFCE00"/><rect y="0" width="20" height="2" fill="#DA121A"/><rect y="4" width="20" height="2" fill="#DA121A"/><rect y="8" width="20" height="2" fill="#DA121A"/><rect y="12" width="20" height="2" fill="#DA121A"/></svg>
  </button>
  <button class="lang-btn" data-lang="es" title="Español" type="button">🇪🇸</button>
  <button class="lang-btn" data-lang="en" title="English" type="button">🇬🇧</button>
</div>

<main>
  <a class="brand" href="/">
    <svg width="26" height="26" viewBox="0 0 46 46" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect x="20" y="4" width="6" height="8" fill="#20241F"/><rect x="14" y="14" width="18" height="8" fill="#20241F"/>
      <rect x="8" y="26" width="30" height="8" fill="#20241F"/><rect x="2" y="38" width="42" height="6" fill="#9E2B3B"/>
    </svg>
    Castellers
  </a>
  <section class="panel">
    <h1 data-i18n="registro_title">Crear compte</h1>
    <p class="lead" data-i18n="registro_lead">L'accés quedarà pendent de verificar el correu i que un administrador el validi.</p>
    <form id="registro-form">
      <label for="nombre" data-i18n="label_nombre">Nom</label>
      <input type="text" id="nombre" required>
      <label for="primerApellido" data-i18n="label_primerApellido">Primer cognom</label>
      <input type="text" id="primerApellido" required>
      <label for="segundoApellido" data-i18n="label_segundoApellido">Segon cognom</label>
      <input type="text" id="segundoApellido">
      <label for="apodo" data-i18n="label_apodo">Àlies (opcional)</label>
      <input type="text" id="apodo">
      <label for="email" data-i18n="label_correu">Correu</label>
      <input type="email" id="email" required>
      <label for="password" data-i18n="label_contrasenya">Contrasenya</label>
      <input type="password" id="password" required minlength="6">
      <label for="password2" data-i18n="label_repetir">Repeteix la contrasenya</label>
      <input type="password" id="password2" required minlength="6">
      <button class="primary" type="submit" id="submit-btn" data-i18n="btn_crear">Crear compte</button>
    </form>
    <div class="msg" id="msg"></div>
    <div class="foot-link"><span data-i18n="foot_ja_compte">Ja tens compte?</span> <a href="/login.html" data-i18n="foot_inicia">Inicia sessió</a></div>
  </section>
</main>

<script>
const TRADUCCIONES = {
  ca: {
    registro_title: 'Crear compte',
    registro_lead: 'L\'accés quedarà pendent de verificar el correu i que un administrador el validi.',
    label_nombre: 'Nom', label_primerApellido: 'Primer cognom', label_segundoApellido: 'Segon cognom',
    label_apodo: 'Àlies (opcional)', label_correu: 'Correu', label_contrasenya: 'Contrasenya',
    label_repetir: 'Repeteix la contrasenya', btn_crear: 'Crear compte',
    foot_ja_compte: 'Ja tens compte?', foot_inicia: 'Inicia sessió',
    err_no_coincide: 'Les contrasenyes no coincideixen.',
    aviso_pendiente: (email) => `Ja hi ha una sol·licitud pendent de verificar amb el correu <strong>${email}</strong>. Comprova que sigui realment el teu correu (és fàcil equivocar-se entre adreces semblants).`,
    btn_reenviar: 'És el meu correu — reenvia\'m l\'enllaç'
  },
  es: {
    registro_title: 'Crear cuenta',
    registro_lead: 'El acceso quedará pendiente de verificar el correo y que un administrador lo valide.',
    label_nombre: 'Nombre', label_primerApellido: 'Primer apellido', label_segundoApellido: 'Segundo apellido',
    label_apodo: 'Alias (opcional)', label_correu: 'Correo', label_contrasenya: 'Contraseña',
    label_repetir: 'Repite la contraseña', btn_crear: 'Crear cuenta',
    foot_ja_compte: '¿Ya tienes cuenta?', foot_inicia: 'Inicia sesión',
    err_no_coincide: 'Las contraseñas no coinciden.',
    aviso_pendiente: (email) => `Ya hay una solicitud pendiente de verificar con el correo <strong>${email}</strong>. Comprueba que sea realmente tu correo (es fácil equivocarse entre direcciones parecidas).`,
    btn_reenviar: 'Es mi correo — reenvíame el enlace'
  },
  en: {
    registro_title: 'Create account',
    registro_lead: 'Access will stay pending until you verify your email and an admin approves it.',
    label_nombre: 'First name', label_primerApellido: 'Last name', label_segundoApellido: 'Second last name',
    label_apodo: 'Nickname (optional)', label_correu: 'Email', label_contrasenya: 'Password',
    label_repetir: 'Repeat password', btn_crear: 'Create account',
    foot_ja_compte: 'Already have an account?', foot_inicia: 'Log in',
    err_no_coincide: 'Passwords do not match.',
    aviso_pendiente: (email) => `There is already a pending request to verify with the email <strong>${email}</strong>. Check that it's really your email (easy to mix up similar addresses).`,
    btn_reenviar: "It's my email — resend the link"
  }
};

let idiomaActual = localStorage.getItem('castellers_idioma') || 'ca';

function aplicarIdioma(idioma) {
  idiomaActual = idioma;
  const t = TRADUCCIONES[idioma] || TRADUCCIONES.ca;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (t[key] !== undefined) el.textContent = t[key];
  });
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === idioma));
  localStorage.setItem('castellers_idioma', idioma);
  document.documentElement.lang = idioma;
}

document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', () => aplicarIdioma(btn.dataset.lang));
});

aplicarIdioma(idiomaActual);

const API = '';
const form = document.getElementById('registro-form');
const msg = document.getElementById('msg');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  msg.className = 'msg';

  const nombre = document.getElementById('nombre').value.trim();
  const primerApellido = document.getElementById('primerApellido').value.trim();
  const segundoApellido = document.getElementById('segundoApellido').value.trim();
  const apodo = document.getElementById('apodo').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const password2 = document.getElementById('password2').value;

  if (password !== password2) {
    msg.textContent = TRADUCCIONES[idiomaActual].err_no_coincide;
    msg.className = 'msg error';
    return;
  }

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  try {
    const res = await fetch(`${API}/api/auth/registro`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nombre, primerApellido, segundoApellido, apodo, email, password, idioma: idiomaActual })
    });
    const data = await res.json();

    if (data.yaPendiente) {
      mostrarAvisoPendiente(data.email);
      btn.disabled = false;
      return;
    }
    if (!res.ok || !data.success) throw new Error(data.error || 'Error desconegut');

    msg.textContent = data.mensaje || 'Compte creat. Revisa el teu correu.';
    msg.className = 'msg ok';
    form.style.display = 'none';
  } catch (err) {
    msg.textContent = err.message;
    msg.className = 'msg error';
    btn.disabled = false;
  }
});

function mostrarAvisoPendiente(email) {
  const t = TRADUCCIONES[idiomaActual];
  msg.className = 'msg error';
  msg.innerHTML = `
    ${t.aviso_pendiente(email)}
    <br><br>
    <button type="button" id="reenviar-btn" style="width:auto; padding:8px 14px;">${t.btn_reenviar}</button>
  `;
  document.getElementById('reenviar-btn').addEventListener('click', async (e) => {
    const btnReenviar = e.target;
    btnReenviar.disabled = true;
    try {
      const res = await fetch(`${API}/api/auth/reenviar-verificacion`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      const data = await res.json();
      if (!res.ok || !data.success) throw new Error(data.error || 'Error desconegut');
      msg.textContent = data.mensaje;
      msg.className = 'msg ok';
    } catch (err) {
      msg.textContent = err.message;
      msg.className = 'msg error';
      btnReenviar.disabled = false;
    }
  });
}
</script>
</body>
</html>
