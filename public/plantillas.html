<style>
  :root{
    --paper: #EAE6DA; --paper-card: #F1EEE4; --ink: #20241F; --ink-soft: #4B5049;
    --thread: #9E2B3B; --gold: #B8893D; --line: #C7C2B0; --ok:#3E7A4E; --radius: 3px;
  }
  * { box-sizing: border-box; }
  body { margin:0; background: linear-gradient(var(--line) 1px, transparent 1px) 0 0/100% 34px, var(--paper); color:var(--ink); font-family:'Work Sans',sans-serif; font-size:15px; line-height:1.5; }
  a { color: var(--thread); }

  nav.topnav { display:flex; align-items:center; gap:22px; padding:18px 28px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  nav.topnav .brand { display:flex; align-items:center; gap:10px; font-family:'Fraunces',serif; font-weight:700; font-size:18px; text-decoration:none; color:var(--ink); font-variant:small-caps; }
  nav.topnav .links { display:flex; gap:4px; flex-wrap:wrap; }
  nav.topnav .links a { font-family:'IBM Plex Mono',monospace; font-size:12px; text-transform:uppercase; letter-spacing:0.04em; padding:8px 12px; border-radius:var(--radius); text-decoration:none; color:var(--ink-soft); border:1px solid transparent; }
  nav.topnav .links a:hover { border-color:var(--line); color:var(--ink); }
  nav.topnav .links a.active { color:var(--ink); border-color:var(--ink); }
  nav.topnav .spacer { margin-left:auto; }
  nav.topnav .user-chip { font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); border:1px solid var(--line); padding:7px 11px; border-radius:var(--radius); }
  .lang-dropdown { position:relative; }
  .lang-dropdown-toggle { width:auto; margin:0; display:flex; align-items:center; gap:7px; background:var(--paper-card); border:1.5px solid var(--line); border-radius:var(--radius); padding:7px 10px; cursor:pointer; color:var(--ink); }
  .lang-dropdown-toggle:hover { border-color: var(--ink); }
  .lang-dropdown-toggle svg.lang-icon { flex-shrink:0; color: var(--ink-soft); }
  .lang-current-flag svg { display:block; border-radius:1px; }
  .lang-dropdown-menu { display:none; position:absolute; top:calc(100% + 6px); right:0; min-width:160px; background:var(--paper-card); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; box-shadow: 0 6px 16px rgba(32,36,31,0.18); z-index:60; }
  .lang-dropdown-menu.open { display:block; }
  .lang-btn { width:100%; margin:0; display:flex; align-items:center; gap:9px; background:none; border:none; padding:10px 12px; cursor:pointer; font-family:'Work Sans',sans-serif; font-size:13px; font-weight:400; text-transform:none; letter-spacing:0; color: var(--ink); text-align:left; }
  .lang-btn:hover { background: var(--paper); }
  .lang-btn.active { font-weight:600; background: var(--paper); }
  .lang-btn svg { display:block; border-radius:1px; flex-shrink:0; }

  main { max-width: 1100px; margin: 0 auto; padding: 34px 28px 80px; }
  .selector-row { display:flex; align-items:center; gap:12px; margin-bottom: 26px; }
  .selector-row label { font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); }
  select {
    padding:10px 12px; border:1px solid var(--line); background:var(--paper-card); color:var(--ink);
    border-radius:var(--radius); font-family:'Fraunces',serif; font-size: 17px; font-weight:600; min-width: 140px;
  }

  .grid { display:grid; grid-template-columns: 1fr 1fr; gap: 22px; }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }

  .preview-grid { display:grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 800px) { .preview-grid { grid-template-columns: 1fr; } }
  .preview-label { font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); margin-bottom:6px; }
  .preview-box {
    position: relative; width: 100%; aspect-ratio: 960/760; background: #FDFCF8;
    border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden;
  }
  .preview-box img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
  .preview-box .p-box {
    position:absolute; transform: translate(-50%,-50%); display:flex; align-items:center; justify-content:center;
    text-align:center; background: rgba(241,238,228,0.92); border: 1px solid var(--ink); border-radius: 3px;
    font-family:'IBM Plex Mono',monospace; font-size: 9px; overflow:hidden; padding: 0 2px; color: var(--ink);
  }
  .preview-empty { display:flex; align-items:center; justify-content:center; height:100%; color: var(--ink-soft); font-size:12.5px; font-style:italic; text-align:center; padding: 20px; }

  section.panel { background: var(--paper-card); border: 1px solid var(--line); border-radius: var(--radius); }
  .panel-head { padding: 15px 18px 12px; border-bottom: 1px solid var(--line); }
  .panel-head h2 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 17px; margin: 0; }
  .panel-body { padding: 18px; }

  .empty-state { text-align:center; padding: 24px 10px; }
  .empty-state .badge { display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--gold); border:1px solid var(--gold); padding:3px 10px; border-radius:20px; margin-bottom:12px; }
  .empty-state p { color: var(--ink-soft); font-size: 13.5px; margin: 0 0 16px; }

  .niveles-list { list-style:none; margin:0 0 16px; padding:0; }
  .niveles-list li { display:flex; justify-content:space-between; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .niveles-list li:last-child { border-bottom: none; }
  .niveles-list .n-nombre { font-family:'Fraunces',serif; font-weight:600; }
  .niveles-list .n-cant { font-family:'IBM Plex Mono',monospace; color: var(--ink-soft); }

  .status-line { display:flex; align-items:center; gap:8px; margin-bottom: 14px; font-size: 13px; color: var(--ink-soft); }
  .status-line .dot { width:8px; height:8px; border-radius:50%; background: var(--ok); }

  button { cursor:pointer; border:none; border-radius:var(--radius); font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:0.04em; text-transform:uppercase; padding:10px 16px; width:100%; }
  button.primary { background: var(--thread); color: var(--paper-card); }
  button.primary:hover { background:#862432; }
  button.ghost { background: transparent; border:1px solid var(--ink); color: var(--ink); }
  button.ghost:hover { background: var(--ink); color: var(--paper-card); }
</style>

// Guardia de sessió: si no has iniciat sessió, et redirigeix a /login.html.
// S'executa abans que la resta del contingut de la pàgina es carregui.
(function() {
  fetch('/api/auth/me').then(r => r.json()).then(data => {
    if (!data.usuario) {
      location.href = '/login.html';
      return;
    }
    window.usuarioActual = data.usuario;
    const chip = document.getElementById('user-chip');
    if (chip) {
      chip.style.cursor = 'pointer';
      chip.onclick = async () => {
        await fetch('/api/auth/logout', { method: 'POST' });
        location.href = '/login.html';
      };
    }
    document.documentElement.classList.add('sessio-confirmada');
    if (window.aplicarIdioma) window.aplicarIdioma(data.usuario.idioma || localStorage.getItem('castellers_idioma') || 'ca');
  }).catch(() => { location.href = '/login.html'; });
})();
</script>

  }[c]));
}

  en: '<svg width="18" height="13" viewBox="0 0 20 14"><rect width="20" height="14" fill="#00247D"/><path d="M0,0 L20,14 M20,0 L0,14" stroke="#FFFFFF" stroke-width="2.6"/><path d="M0,0 L20,14 M20,0 L0,14" stroke="#CF142B" stroke-width="1.1"/><path d="M10,0 V14 M0,7 H20" stroke="#FFFFFF" stroke-width="4.4"/><path d="M10,0 V14 M0,7 H20" stroke="#CF142B" stroke-width="2.4"/></svg>'
};

    planta_def: (n, r) => `Planta definida — ${n} posicions (${r} rols)`,

  },
  es: {
    nav_inici: 'Inicio', nav_assajos: 'Ensayos', nav_actuacions: 'Actuaciones', nav_imatges: 'Imágenes',
    nav_plantilles: 'Plantillas', nav_membres: 'Miembros', nav_usuaris: 'Usuarios', chip_tancar: 'Cerrar sesión',

    carregant: 'Cargando…', sense_plantilla: 'Sin plantilla', no_carregat: 'No se ha podido cargar.',
    no_estructura: (tipo) => `Aún no hay una estructura definida para el castell ${tipo}.`,
    crear_estructura: 'Crear la estructura del castell', editar_estructura: 'Editar la estructura',

  }
};
let idiomaActual = localStorage.getItem('castellers_idioma') || 'ca';
function t(key) { return (TRADUCCIONES[idiomaActual] || TRADUCCIONES.ca)[key] || key; }

function aplicarIdioma(idioma) {
  idiomaActual = idioma;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    const val = t(key);
    if (val !== key) el.textContent = val;
  });
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === idioma));
  document.getElementById('lang-current-flag').innerHTML = FLAGS_SVG[idioma] || FLAGS_SVG.ca;
  document.getElementById('lang-dropdown-menu').classList.remove('open');
  localStorage.setItem('castellers_idioma', idioma);
  document.documentElement.lang = idioma;
  const chip = document.getElementById('user-chip');
  if (chip && window.usuarioActual) chip.textContent = `${window.usuarioActual.nombre} · ${t('chip_tancar')}`;
  cargarTodo();
}
window.aplicarIdioma = aplicarIdioma;

const langDropdownToggle = document.getElementById('lang-dropdown-toggle');
const langDropdownMenu = document.getElementById('lang-dropdown-menu');
langDropdownToggle.addEventListener('click', (e) => {
  e.stopPropagation();
  langDropdownMenu.classList.toggle('open');
});
document.addEventListener('click', () => langDropdownMenu.classList.remove('open'));
langDropdownMenu.addEventListener('click', (e) => e.stopPropagation());

document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', async () => {
    aplicarIdioma(btn.dataset.lang);
    if (window.usuarioActual) {
      try {
        await fetch(`${API}/api/auth/idioma`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ idioma: btn.dataset.lang }) });
      } catch (err) { console.error(err); }
    }
  });
});

// Normalitza un nom de posició per agrupar-lo pel seu rol base: treu
// direccions (izq/der/esquerra/dreta) i ordinals (1r, 2n, 3r, 1eres, etc.)
// perquè "Crossa izq", "Crossa Der", "Crossa der" comptin totes com "Crossa".
function normalizarRol(slot) {
  let s = slot.toLowerCase();
  s = s.replace(/\b(izq|izquierda|esquerra|esquerre|der|dcha|derecha|dreta)\b/g, '');
  s = s.replace(/\b(\d+r|\d+n|\d+a|\d+er|\d+on|\d+eres|\d+eras|\d+nes|\d+es|\d+)\b/g, '');
  s = s.replace(/\s+/g, ' ').trim();
  if (!s) return slot;
  return s.replace(/\b\w/g, c => c.toUpperCase());
}

async function cargarCastell(tipo) {
  const body = document.getElementById('castell-body');
  body.innerHTML = t('carregant');
  try {
    const res = await fetch(`${API}/api/castells-estructura/${tipo}`);
    const data = await res.json();
    const estructura = data.estructura;

    if (!estructura) {
      body.innerHTML = `
        <div class="empty-state">
          <span class="badge">${t('sense_plantilla')}</span>
          <p>${t('no_estructura')(escapeHtml(tipo))}</p>
          <button class="primary" id="crear-castell-btn" type="button">${t('crear_estructura')}</button>
        </div>
      `;
      document.getElementById('crear-castell-btn').addEventListener('click', () => {
        location.href = `/castell-editor.html?tipo=${tipo}`;
      });
      return;
    }

    const niveles = estructura.niveles || [];
    body.innerHTML = `
      <div class="status-line"><span class="dot"></span> ${t('estructura_def')(niveles.length)}</div>
      <ul class="niveles-list">
        ${niveles.map(n => `<li><span class="n-nombre">${escapeHtml(n.nombre)}</span><span class="n-cant">${n.cantidad}</span></li>`).join('')}
      </ul>
      <button class="ghost" id="editar-castell-btn" type="button">${t('editar_estructura')}</button>
    `;
    document.getElementById('editar-castell-btn').addEventListener('click', () => {
      location.href = `/castell-editor.html?tipo=${tipo}`;
    });
  } catch (err) {
    console.error(err);
    body.innerHTML = `<p>${t('no_carregat')}</p>`;
  }
}

async function cargarPinya(tipo) {
  const body = document.getElementById('pinya-body');
  body.innerHTML = t('carregant');
  try {
    const res = await fetch(`${API}/api/plantillas/${tipo}`);
    const data = await res.json();
    const posiciones = data.data || [];

    if (!posiciones.length) {
      body.innerHTML = `
        <div class="empty-state">
          <span class="badge">${t('sense_plantilla')}</span>
          <p>${t('no_pinya')(escapeHtml(tipo))}</p>
          <button class="primary" id="crear-pinya-btn" type="button">${t('crear_pinya')}</button>
        </div>
      `;
      document.getElementById('crear-pinya-btn').addEventListener('click', () => {
        location.href = `/plantilla-editor.html?tipo=${tipo}`;
      });
      return;
    }

    // agrupem per rol base (sense direcció ni ordinal) i sumem quants
    // llocs hi ha en total per a cada rol
    const recuentos = {};
    posiciones.forEach(p => {
      const base = normalizarRol(p.slot);
      recuentos[base] = (recuentos[base] || 0) + 1;
    });
    const roles = Object.keys(recuentos).sort();

    body.innerHTML = `
      <div class="status-line"><span class="dot"></span> ${t('planta_def')(posiciones.length, roles.length)}</div>
      <ul class="niveles-list">
        ${roles.map(r => `<li><span class="n-nombre">${escapeHtml(r)}</span><span class="n-cant">${recuentos[r]}</span></li>`).join('')}
      </ul>
      <button class="ghost" id="editar-pinya-btn" type="button">${t('editar_pinya')}</button>
    `;
    document.getElementById('editar-pinya-btn').addEventListener('click', () => {
      location.href = `/plantilla-editor.html?tipo=${tipo}`;
    });
  } catch (err) {
    console.error(err);
    body.innerHTML = `<p>${t('no_carregat')}</p>`;
  }
}

async function cargarPreview(tipo) {
  const boxCastell = document.getElementById('preview-castell');
  const boxPinya = document.getElementById('preview-pinya');
  boxCastell.innerHTML = `<div class="preview-empty">${t('carregant')}</div>`;
  boxPinya.innerHTML = `<div class="preview-empty">${t('carregant')}</div>`;

  // --- Castell ---
  try {
    const estRes = await fetch(`${API}/api/castells-estructura/${tipo}`);
    const estData = await estRes.json();
    const imagenId = estData.estructura ? estData.estructura.imagenId : null;

    const etiRes = await fetch(`${API}/api/castell-plantilla/${tipo}`);
    const etiData = await etiRes.json();
    const etiquetas = etiData.data || [];

    let dataUrl = null;
    if (imagenId) {
      const imgsRes = await fetch(`${API}/api/imagenes?categoria=Castells`);
      const imgsData = await imgsRes.json();
      const img = (imgsData.data || []).find(i => i.id === imagenId);
      if (img) dataUrl = img.dataUrl;
    }

    if (dataUrl && etiquetas.length) {
      boxCastell.innerHTML = `<img src="${escapeHtml(dataUrl)}" alt="">` + etiquetas.map(e => {
        const leftPct = (e.x / 960) * 100, topPct = (e.y / 760) * 100;
        const wPct = (e.w / 960) * 100, hPct = (e.h / 760) * 100;
        const mismoRol = etiquetas.filter(x => x.slot === e.slot).length > 1;
        const texto = mismoRol ? `${e.slot}-${e.slotIndex}` : e.slot;
        return `<div class="p-box" style="left:${leftPct}%; top:${topPct}%; width:${wPct}%; height:${hPct}%; transform:translate(-50%,-50%);">${escapeHtml(texto)}</div>`;
      }).join('');
    } else {
      boxCastell.innerHTML = `<div class="preview-empty">${t('sense_disseny_castell')}</div>`;
    }
  } catch (err) {
    console.error(err);
    boxCastell.innerHTML = `<div class="preview-empty">${t('no_carregat')}</div>`;
  }

  // --- Pinya ---
  try {
    const res = await fetch(`${API}/api/plantillas/${tipo}`);
    const data = await res.json();
    const posiciones = data.data || [];

    if (posiciones.length) {
      boxPinya.innerHTML = posiciones.map(p => {
        const leftPct = (p.x / 960) * 100, topPct = (p.y / 760) * 100;
        const wPct = (p.w / 960) * 100, hPct = (p.h / 760) * 100;
        const mismoRol = posiciones.filter(x => x.slot === p.slot).length > 1;
        const texto = mismoRol ? `${p.slot}-${p.slotIndex}` : p.slot;
        const rot = Number(p.rotacion) || 0;
        return `<div class="p-box" style="left:${leftPct}%; top:${topPct}%; width:${wPct}%; height:${hPct}%; transform:translate(-50%,-50%) rotate(${rot}deg);">${escapeHtml(texto)}</div>`;
      }).join('');
    } else {
      boxPinya.innerHTML = `<div class="preview-empty">${t('sense_disseny_pinya')}</div>`;
    }
  } catch (err) {
    console.error(err);
    boxPinya.innerHTML = `<div class="preview-empty">${t('no_carregat')}</div>`;
  }
}

function cargarTodo() {
  const tipo = tipoSelect.value;
  cargarCastell(tipo);
  cargarPinya(tipo);
  cargarPreview(tipo);
}

tipoSelect.addEventListener('change', cargarTodo);

const tipoParam = new URLSearchParams(location.search).get('tipo');
if (tipoParam) tipoSelect.value = tipoParam;

cargarTodo();
</script>
