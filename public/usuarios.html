<!DOCTYPE html>
<html lang="ca">
<head>
<style>html:not(.sessio-confirmada) body { visibility: hidden; }</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Castellers · Usuaris</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#EAE6DA; --paper-card:#F1EEE4; --ink:#20241F; --ink-soft:#4B5049; --thread:#9E2B3B; --gold:#B8893D; --line:#C7C2B0; --ok:#3E7A4E; --radius:3px; }
  * { box-sizing: border-box; }
  body { margin:0; background: linear-gradient(var(--line) 1px, transparent 1px) 0 0/100% 34px, var(--paper); color:var(--ink); font-family:'Work Sans',sans-serif; font-size:14.5px; line-height:1.5; }
  a { color: var(--thread); }

  nav.topnav { display:flex; align-items:center; gap:22px; padding:18px 28px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  nav.topnav .brand { display:flex; align-items:center; gap:10px; font-family:'Fraunces',serif; font-weight:700; font-size:18px; text-decoration:none; color:var(--ink); font-variant:small-caps; }
  nav.topnav .links { display:flex; gap:4px; flex-wrap:wrap; }
  nav.topnav .links a { font-family:'IBM Plex Mono',monospace; font-size:12px; text-transform:uppercase; letter-spacing:0.04em; padding:8px 12px; border-radius:var(--radius); text-decoration:none; color:var(--ink-soft); border:1px solid transparent; }
  nav.topnav .links a:hover { border-color:var(--line); color:var(--ink); }
  nav.topnav .links a.active { color:var(--ink); border-color:var(--ink); }
  nav.topnav .spacer { margin-left:auto; }
  nav.topnav .user-chip { font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); border:1px solid var(--line); padding:7px 11px; border-radius:var(--radius); cursor:pointer; background:none; }
  .lang-dropdown { position:relative; }
  .lang-dropdown-toggle { width:auto; margin:0; display:flex; align-items:center; gap:7px; background:var(--paper-card); border:1.5px solid var(--line); border-radius:var(--radius); padding:7px 10px; cursor:pointer; color:var(--ink); }
  .lang-dropdown-toggle:hover { border-color: var(--ink); }
  .lang-dropdown-toggle svg.lang-icon { flex-shrink:0; color: var(--ink-soft); }
  .lang-current-flag svg { display:block; border-radius:1px; }
  .lang-dropdown-menu { display:none; position:absolute; top:calc(100% + 6px); right:0; min-width:160px; background:var(--paper-card); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; box-shadow: 0 6px 16px rgba(32,36,31,0.18); z-index:60; }
  .lang-dropdown-menu.open { display:block; }
  .lang-btn { width:100%; margin:0; display:flex; align-items:center; gap:9px; background:none; border:none; padding:10px 12px; cursor:pointer; font-family:'Work Sans',sans-serif; font-size:13px; font-weight:400; text-transform:none; letter-spacing:0; color: var(--ink); text-align:left; }
  .lang-btn:hover { background: var(--paper); }
  .lang-btn.active { font-weight:600; background: var(--paper); }
  .lang-btn svg { display:block; border-radius:1px; flex-shrink:0; }

  main { max-width: 1000px; margin: 0 auto; padding: 34px 28px 80px; }
  section.panel { background: var(--paper-card); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 22px; }
  .panel-head { padding: 15px 18px 12px; border-bottom: 1px solid var(--line); }
  .panel-head h2 { font-family:'Fraunces',serif; font-weight:600; font-size:17px; margin:0; }
  .panel-body { padding: 18px; }

  .empty-note { color: var(--ink-soft); font-style: italic; padding: 14px 0; text-align:center; }
  ul.lista { list-style:none; margin:0; padding:0; }
  ul.lista li { display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding: 12px; border:1px solid var(--line); border-radius: var(--radius); margin-bottom:8px; background: var(--paper); }
  .u-nombre { font-family:'Fraunces',serif; font-weight:600; }
  .u-email { font-size:12px; color: var(--ink-soft); }
  .u-meta { margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .status-badge { font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase; padding:2px 8px; border-radius:20px; border:1px solid var(--ink-soft); color:var(--ink-soft); }
  .status-badge.activo { border-color: var(--ok); color: var(--ok); }
  .status-badge.pendiente { border-color: var(--gold); color: var(--gold); }
  .status-badge.rechazado { border-color: var(--thread); color: var(--thread); }
  .perm-chip { font-family:'IBM Plex Mono',monospace; font-size:9.5px; padding:1px 7px; border-radius:20px; border:1px solid var(--ink-soft); color:var(--ink-soft); }

  button { cursor:pointer; border:none; border-radius:var(--radius); font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.04em; text-transform:uppercase; padding:8px 12px; }
  button.primary { background: var(--thread); color: var(--paper-card); }
  button.primary:hover { background:#862432; }
  button.ghost { background: transparent; border:1px solid var(--ink); color: var(--ink); }
  button.ghost:hover { background: var(--ink); color: var(--paper-card); }

  label { display:block; font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); margin:12px 0 4px; }
  label:first-of-type { margin-top:0; }
  input[type="text"], input[type="password"] { width:100%; max-width: 340px; padding:9px 10px; border:1px solid var(--line); background:var(--paper); border-radius:var(--radius); }
  .check-row { display:flex; gap:16px; margin-top:6px; flex-wrap:wrap; }
  .check-row label { display:flex; align-items:center; gap:6px; margin:0; font-size:12px; text-transform:none; letter-spacing:0; }
  .msg { margin-top:12px; padding:9px 11px; border-radius:var(--radius); font-size:13px; display:none; max-width: 340px; }
  .msg.ok { display:block; background:#E4EEE6; border:1px solid var(--ok); color:var(--ok); }
  .msg.error { display:block; background:#F3E7E5; border:1px solid var(--thread); color:var(--thread); }

  .badge-info { display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--gold); border:1px solid var(--gold); padding:3px 10px; border-radius:20px; margin-bottom:14px; }

  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(32,36,31,0.55); align-items:flex-start; justify-content:center; padding:30px 20px; z-index:80; overflow-y:auto; }
  .modal-overlay.open { display:flex; }
  .modal-box { background: var(--paper); border-radius: var(--radius); max-width: 400px; width:100%; padding: 20px 22px 22px; border:1px solid var(--line); }
  .modal-box h3 { font-family:'Fraunces',serif; font-size:19px; margin:0 0 14px; }
  .modal-actions { display:flex; justify-content:flex-end; gap:10px; margin-top: 18px; }
</style>
</head>
<body>

<nav class="topnav">
  <a class="brand" href="/">
    <svg width="26" height="26" viewBox="0 0 46 46" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect x="20" y="4" width="6" height="8" fill="#20241F"/><rect x="14" y="14" width="18" height="8" fill="#20241F"/>
      <rect x="8" y="26" width="30" height="8" fill="#20241F"/><rect x="2" y="38" width="42" height="6" fill="#9E2B3B"/>
    </svg>
    Castellers
  </a>
  <div class="links">
    <a href="/" data-i18n="nav_inici">Inici</a>
    <a href="/ensayos.html" data-i18n="nav_assajos">Assajos</a>
    <a href="/actuaciones.html" data-i18n="nav_actuacions">Actuacions</a>
    <a href="/biblioteca-imagenes.html" data-i18n="nav_imatges">Imatges</a>

  <div class="spacer"></div>
  <div class="lang-dropdown">
    <button class="lang-dropdown-toggle" id="lang-dropdown-toggle" type="button" aria-label="Canviar idioma">
      <svg class="lang-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
        <circle cx="12" cy="12" r="9"/>
        <path d="M3 12h18"/>
        <path d="M12 3c2.8 2.6 4.3 5.7 4.3 9s-1.5 6.4-4.3 9c-2.8-2.6-4.3-5.7-4.3-9s1.5-6.4 4.3-9z"/>
      </svg>
      <span class="lang-current-flag" id="lang-current-flag"></span>
      <svg width="9" height="9" viewBox="0 0 10 6" fill="none"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.6"/></svg>
    </button>
    <div class="lang-dropdown-menu" id="lang-dropdown-menu">
      <button class="lang-btn" data-lang="ca" type="button">
        <svg width="20" height="14" viewBox="0 0 20 14"><rect width="20" height="14" fill="#FFCE00"/><rect y="0" width="20" height="2" fill="#DA121A"/><rect y="4" width="20" height="2" fill="#DA121A"/><rect y="8" width="20" height="2" fill="#DA121A"/><rect y="12" width="20" height="2" fill="#DA121A"/></svg>
        Català
      </button>
      <button class="lang-btn" data-lang="es" type="button">
        <svg width="20" height="14" viewBox="0 0 20 14"><rect width="20" height="14" fill="#AA151B"/><rect y="3.5" width="20" height="7" fill="#F1BF00"/></svg>
        Español
      </button>
      <button class="lang-btn" data-lang="en" type="button">
        <svg width="20" height="14" viewBox="0 0 20 14">
          <rect width="20" height="14" fill="#00247D"/>
          <path d="M0,0 L20,14 M20,0 L0,14" stroke="#FFFFFF" stroke-width="2.6"/>
          <path d="M0,0 L20,14 M20,0 L0,14" stroke="#CF142B" stroke-width="1.1"/>
          <path d="M10,0 V14 M0,7 H20" stroke="#FFFFFF" stroke-width="4.4"/>
          <path d="M10,0 V14 M0,7 H20" stroke="#CF142B" stroke-width="2.4"/>
        </svg>
        English
      </button>
    </div>
  </div>
  <span class="user-chip" id="user-chip">…</span>
</nav>

<main id="main-contenido">
  <p class="empty-note">Carregant…</p>
</main>

<div class="modal-overlay" id="permisos-overlay">
  <div class="modal-box">
    <h3 id="permisos-titulo">Permisos</h3>
    <div class="check-row" id="permisos-checks" style="flex-direction:column; gap:10px;"></div>
    <div class="modal-actions">
      <button class="ghost" id="permisos-cancelar" type="button">Cancel·lar</button>
      <button class="primary" id="permisos-guardar" type="button">Desar</button>
    </div>
  </div>
</div>

<script>
const API = '';
let usuarioActual = null;

const FLAGS_SVG = {
  ca: '<svg width="18" height="13" viewBox="0 0 20 14"><rect width="20" height="14" fill="#FFCE00"/><rect y="0" width="20" height="2" fill="#DA121A"/><rect y="4" width="20" height="2" fill="#DA121A"/><rect y="8" width="20" height="2" fill="#DA121A"/><rect y="12" width="20" height="2" fill="#DA121A"/></svg>',
  es: '<svg width="18" height="13" viewBox="0 0 20 14"><rect width="20" height="14" fill="#AA151B"/><rect y="3.5" width="20" height="7" fill="#F1BF00"/></svg>',
  en: '<svg width="18" height="13" viewBox="0 0 20 14"><rect width="20" height="14" fill="#00247D"/><path d="M0,0 L20,14 M20,0 L0,14" stroke="#FFFFFF" stroke-width="2.6"/><path d="M0,0 L20,14 M20,0 L0,14" stroke="#CF142B" stroke-width="1.1"/><path d="M10,0 V14 M0,7 H20" stroke="#FFFFFF" stroke-width="4.4"/><path d="M10,0 V14 M0,7 H20" stroke="#CF142B" stroke-width="2.4"/></svg>'
};
const TRADUCCIONES = {
  ca: {
    nav_inici: 'Inici', nav_assajos: 'Assajos', nav_actuacions: 'Actuacions', nav_imatges: 'Imatges',
    nav_plantilles: 'Plantilles', nav_membres: 'Membres', nav_perfil: 'El meu perfil', nav_usuaris: 'Usuaris',
    chip_tancar: 'Tancar sessió',
    cal_login: 'Cal iniciar sessió per veure aquesta pàgina.', btn_login: 'Iniciar sessió',
    altes_pendents: 'Altes pendents', tots_usuaris: 'Tots els usuaris', el_meu_perfil: 'El meu perfil',
    label_nombre: 'Nom', label_password_actual: 'Contrasenya actual (només si vols canviar-la)',
    label_password_nueva: 'Contrasenya nova', btn_desar: 'Desar canvis', desat_ok: 'Desat correctament.',
    cap_alta_pendent: 'Cap alta pendent.', cap_usuari: 'Cap usuari.', no_carregat: 'No s\'han pogut carregar.',
    btn_aprovar: 'Aprovar', btn_rebutjar: 'Rebutjar', confirm_rebutjar: 'Segur que vols rebutjar aquesta alta?',
    btn_editar_permisos: 'Editar permisos', permisos_titulo: 'Permisos', btn_cancelar: 'Cancel·lar', btn_guardar: 'Desar',
    err_permisos: 'No s\'han pogut desar els permisos.', carregant: 'Carregant…'
  },
  es: {
    nav_inici: 'Inicio', nav_assajos: 'Ensayos', nav_actuacions: 'Actuaciones', nav_imatges: 'Imágenes',
    nav_plantilles: 'Plantillas', nav_membres: 'Miembros', nav_perfil: 'Mi perfil', nav_usuaris: 'Usuarios',
    chip_tancar: 'Cerrar sesión',
    cal_login: 'Debes iniciar sesión para ver esta página.', btn_login: 'Iniciar sesión',
    altes_pendents: 'Altas pendientes', tots_usuaris: 'Todos los usuarios', el_meu_perfil: 'Mi perfil',
    label_nombre: 'Nombre', label_password_actual: 'Contraseña actual (solo si quieres cambiarla)',
    label_password_nueva: 'Contraseña nueva', btn_desar: 'Guardar cambios', desat_ok: 'Guardado correctamente.',
    cap_alta_pendent: 'Ninguna alta pendiente.', cap_usuari: 'Ningún usuario.', no_carregat: 'No se han podido cargar.',
    btn_aprovar: 'Aprobar', btn_rebutjar: 'Rechazar', confirm_rebutjar: '¿Seguro que quieres rechazar esta alta?',
    btn_editar_permisos: 'Editar permisos', permisos_titulo: 'Permisos', btn_cancelar: 'Cancelar', btn_guardar: 'Guardar',
    err_permisos: 'No se han podido guardar los permisos.', carregant: 'Cargando…'
  },
  en: {
    nav_inici: 'Home', nav_assajos: 'Rehearsals', nav_actuacions: 'Performances', nav_imatges: 'Images',
    nav_plantilles: 'Templates', nav_membres: 'Members', nav_perfil: 'My profile', nav_usuaris: 'Users',
    chip_tancar: 'Log out',
    cal_login: 'You must log in to view this page.', btn_login: 'Log in',
    altes_pendents: 'Pending sign-ups', tots_usuaris: 'All users', el_meu_perfil: 'My profile',
    label_nombre: 'Name', label_password_actual: 'Current password (only if you want to change it)',
    label_password_nueva: 'New password', btn_desar: 'Save changes', desat_ok: 'Saved successfully.',
    cap_alta_pendent: 'No pending sign-ups.', cap_usuari: 'No users.', no_carregat: 'Could not load.',
    btn_aprovar: 'Approve', btn_rebutjar: 'Reject', confirm_rebutjar: 'Are you sure you want to reject this sign-up?',
    btn_editar_permisos: 'Edit permissions', permisos_titulo: 'Permissions', btn_cancelar: 'Cancel', btn_guardar: 'Save',
    err_permisos: 'Could not save permissions.', carregant: 'Loading…'
  }
};
let idiomaActual = localStorage.getItem('castellers_idioma') || 'ca';
function t(key) { return (TRADUCCIONES[idiomaActual] || TRADUCCIONES.ca)[key] || key; }

function aplicarIdioma(idioma) {
  idiomaActual = idioma;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    const val = t(key);
    if (val !== key) el.textContent = val;
  });
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === idioma));
  document.getElementById('lang-current-flag').innerHTML = FLAGS_SVG[idioma] || FLAGS_SVG.ca;
  document.getElementById('lang-dropdown-menu').classList.remove('open');
  localStorage.setItem('castellers_idioma', idioma);
  document.documentElement.lang = idioma;
  const chip = document.getElementById('user-chip');
  if (chip && usuarioActual) chip.textContent = `${usuarioActual.nombre} · ${t('chip_tancar')}`;
  // el contingut dinàmic (llistes, modal) es torna a pintar perquè reculli
  // les traduccions noves
  render();
}

const langDropdownToggle = document.getElementById('lang-dropdown-toggle');
const langDropdownMenu = document.getElementById('lang-dropdown-menu');
langDropdownToggle.addEventListener('click', (e) => {
  e.stopPropagation();
  langDropdownMenu.classList.toggle('open');
});
document.addEventListener('click', () => langDropdownMenu.classList.remove('open'));
langDropdownMenu.addEventListener('click', (e) => e.stopPropagation());

document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', async () => {
    aplicarIdioma(btn.dataset.lang);
    if (usuarioActual) {
      try {
        await fetch(`${API}/api/auth/idioma`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ idioma: btn.dataset.lang }) });
      } catch (err) { console.error(err); }
    }
  });
});

function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function nombreCompleto(u) {
  const partes = [u.nombre, u.primerApellido, u.segundoApellido].filter(Boolean);
  const base = partes.join(' ');
  return u.apodo ? `${base} · ${u.apodo}` : base;
}

async function cargarSesion() {
  const res = await fetch(`${API}/api/auth/me`);
  const data = await res.json();
  usuarioActual = data.usuario;

  if (!usuarioActual) {
    location.href = '/login.html';
    return;
  }
  if (!(usuarioActual.permisos || []).includes('AdminGeneral')) {
    location.href = '/perfil.html';
    return;
  }

  const chip = document.getElementById('user-chip');
  chip.onclick = async () => {
    await fetch(`${API}/api/auth/logout`, { method: 'POST' });
    location.href = '/login.html';
  };
  document.documentElement.classList.add('sessio-confirmada');
  aplicarIdioma(usuarioActual.idioma || idiomaActual);
}

async function render() {
  const main = document.getElementById('main-contenido');
  if (!usuarioActual) {
    main.innerHTML = `
      <section class="panel"><div class="panel-body" style="text-align:center; padding:40px 20px;">
        <p>${t('cal_login')}</p>
        <button class="primary" onclick="location.href='/login.html'" type="button">${t('btn_login')}</button>
      </div></section>
    `;
    return;
  }

  main.innerHTML = `
    <section class="panel">
      <div class="panel-head"><h2>${t('altes_pendents')}</h2></div>
      <div class="panel-body" id="pendientes-body"><p class="empty-note">${t('carregant')}</p></div>
    </section>
    <section class="panel">
      <div class="panel-head"><h2>${t('tots_usuaris')}</h2></div>
      <div class="panel-body" id="usuarios-body"><p class="empty-note">${t('carregant')}</p></div>
    </section>
  `;

  await cargarPendientes();
  await cargarUsuarios();
}

/* ---------------- Admin: altes pendents ---------------- */

async function cargarPendientes() {
  const body = document.getElementById('pendientes-body');
  try {
    const res = await fetch(`${API}/api/usuarios/pendientes`);
    const data = await res.json();
    const pendientes = data.data || [];
    if (!pendientes.length) {
      body.innerHTML = `<p class="empty-note">${t('cap_alta_pendent')}</p>`;
      return;
    }
    body.innerHTML = `<ul class="lista">${pendientes.map(u => `
      <li>
        <div>
          <div class="u-nombre">${escapeHtml(nombreCompleto(u))}</div>
          <div class="u-email">${escapeHtml(u.email)}</div>
        </div>
        <div class="u-meta">
          <button class="ghost aprobar-btn" data-id="${u.id}" type="button">${t('btn_aprovar')}</button>
          <button class="ghost rechazar-btn" data-id="${u.id}" type="button">${t('btn_rebutjar')}</button>
        </div>
      </li>
    `).join('')}</ul>`;

    body.querySelectorAll('.aprobar-btn').forEach(btn => btn.addEventListener('click', async () => {
      btn.disabled = true;
      try {
        await fetch(`${API}/api/usuarios/${btn.dataset.id}/aprobar`, { method: 'PUT' });
        await cargarPendientes();
        await cargarUsuarios();
      } catch (err) { console.error(err); btn.disabled = false; }
    }));
    body.querySelectorAll('.rechazar-btn').forEach(btn => btn.addEventListener('click', async () => {
      if (!confirm(t('confirm_rebutjar'))) return;
      btn.disabled = true;
      try {
        await fetch(`${API}/api/usuarios/${btn.dataset.id}/rechazar`, { method: 'PUT' });
        await cargarPendientes();
        await cargarUsuarios();
      } catch (err) { console.error(err); btn.disabled = false; }
    }));
  } catch (err) {
    console.error(err);
    body.innerHTML = `<p class="empty-note">${t('no_carregat')}</p>`;
  }
}

/* ---------------- Admin: tots els usuaris ---------------- */

const PERMISOS_DISPONIBLES = ['Tècnica', 'Junta', 'AdminGeneral'];

async function cargarUsuarios() {
  const body = document.getElementById('usuarios-body');
  try {
    const res = await fetch(`${API}/api/usuarios`);
    const data = await res.json();
    const usuarios = data.data || [];
    if (!usuarios.length) { body.innerHTML = `<p class="empty-note">${t('cap_usuari')}</p>`; return; }

    body.innerHTML = `<ul class="lista">${usuarios.map(u => `
      <li data-id="${u.id}">
        <div>
          <div class="u-nombre">${escapeHtml(nombreCompleto(u))}</div>
          <div class="u-email">${escapeHtml(u.email)}</div>
        </div>
        <div class="u-meta">
          <span class="status-badge ${u.estado}">${u.estado}</span>
          ${(u.permisos || []).map(p => `<span class="perm-chip">${escapeHtml(p)}</span>`).join('')}
          <button class="ghost editar-permisos-btn" data-id="${u.id}" type="button">${t('btn_editar_permisos')}</button>
        </div>
      </li>
    `).join('')}</ul>`;

    body.querySelectorAll('.editar-permisos-btn').forEach(btn => {
      btn.addEventListener('click', () => abrirEditorPermisos(usuarios.find(u => u.id === Number(btn.dataset.id))));
    });
  } catch (err) {
    console.error(err);
    body.innerHTML = `<p class="empty-note">${t('no_carregat')}</p>`;
  }
}

const permisosOverlay = document.getElementById('permisos-overlay');
let permisosUsuarioId = null;

function abrirEditorPermisos(usuario) {
  permisosUsuarioId = usuario.id;
  const actuales = new Set(usuario.permisos || []);
  document.getElementById('permisos-titulo').textContent = `${t('permisos_titulo')} · ${nombreCompleto(usuario)}`;
  document.getElementById('permisos-checks').innerHTML = PERMISOS_DISPONIBLES.map(p => `
    <label><input type="checkbox" value="${escapeHtml(p)}" ${actuales.has(p) ? 'checked' : ''}> ${escapeHtml(p)}</label>
  `).join('');
  permisosOverlay.classList.add('open');
}

document.getElementById('permisos-cancelar').addEventListener('click', () => permisosOverlay.classList.remove('open'));
permisosOverlay.addEventListener('click', (e) => { if (e.target === permisosOverlay) permisosOverlay.classList.remove('open'); });

document.getElementById('permisos-guardar').addEventListener('click', async () => {
  const seleccion = [...document.querySelectorAll('#permisos-checks input:checked')].map(el => el.value);
  await guardarPermisos(permisosUsuarioId, seleccion);
  permisosOverlay.classList.remove('open');
});

async function guardarPermisos(id, permisos) {
  try {
    await fetch(`${API}/api/usuarios/${id}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ permisos })
    });
    await cargarUsuarios();
  } catch (err) {
    console.error(err);
    alert(t('err_permisos'));
  }
}

(async function init() {
  await cargarSesion();
})();
</script>
