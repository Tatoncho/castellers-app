<style>
  :root{
    --paper: #EAE6DA; --paper-card: #F1EEE4; --ink: #20241F; --ink-soft: #4B5049;
    --thread: #9E2B3B; --gold: #B8893D; --line: #C7C2B0;
    --ok: #3E7A4E; --bad: #A3323A; --radius: 3px;
  }
  * { box-sizing: border-box; }
  body { margin:0; background: linear-gradient(var(--line) 1px, transparent 1px) 0 0/100% 34px, var(--paper); color:var(--ink); font-family:'Work Sans',sans-serif; font-size:14.5px; line-height:1.5; }
  a { color: var(--thread); }

  nav.topnav { display:flex; align-items:center; gap:22px; padding:18px 28px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  nav.topnav .brand { display:flex; align-items:center; gap:10px; font-family:'Fraunces',serif; font-weight:700; font-size:18px; text-decoration:none; color:var(--ink); font-variant:small-caps; }
  nav.topnav .links { display:flex; gap:4px; flex-wrap:wrap; }
  nav.topnav .links a { font-family:'IBM Plex Mono',monospace; font-size:12px; text-transform:uppercase; letter-spacing:0.04em; padding:8px 12px; border-radius:var(--radius); text-decoration:none; color:var(--ink-soft); border:1px solid transparent; }
  nav.topnav .links a:hover { border-color:var(--line); color:var(--ink); }
  nav.topnav .links a.active { color:var(--ink); border-color:var(--ink); }
  nav.topnav .spacer { margin-left:auto; }
  nav.topnav .user-chip { font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); border:1px solid var(--line); padding:7px 11px; border-radius:var(--radius); cursor:pointer; background:none; }
  .lang-switcher { display:flex; gap:6px; }
  .lang-btn { width:auto; margin:0; padding:5px 7px; background:var(--paper-card); border:1.5px solid var(--line); border-radius:var(--radius); font-size:15px; line-height:1; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .lang-btn.active { border-color: var(--ink); }
  .lang-btn svg { display:block; border-radius:1px; }

  main { max-width: 1300px; margin: 0 auto; padding: 28px 28px 80px; }
  .top-row { display: grid; grid-template-columns: 380px 1fr; gap: 22px; align-items: start; margin-bottom: 22px; }
  .detail-row { display: block; }
  @media (max-width: 940px) { .top-row { grid-template-columns: 1fr; } }

  .cal-dow { display:grid; grid-template-columns: repeat(7,1fr); text-align:center; font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--ink-soft); text-transform:uppercase; margin-bottom:6px; }
  .cal-grid { display:grid; grid-template-columns: repeat(7,1fr); gap: 4px; }
  .cal-day {
    position:relative; aspect-ratio: 1; display:flex; align-items:center; justify-content:center;
    border:1px solid var(--line); border-radius: var(--radius); background: var(--paper); font-size: 12.5px;
    color: var(--ink-soft); cursor:default;
  }
  .cal-day.otro-mes { opacity: 0.35; }
  .cal-day.con-assaig { background: var(--paper-card); color: var(--ink); font-weight:600; cursor:pointer; border-color: var(--thread); }
  .cal-day.con-assaig:hover { background: #EFE9DB; }
  .cal-day.avui { box-shadow: inset 0 0 0 1.6px var(--gold); }
  .cal-day .dot { position:absolute; bottom:4px; width:5px; height:5px; border-radius:50%; background: var(--thread); }

  .dia-item { border:1px solid var(--line); border-radius: var(--radius); padding: 12px; margin-bottom: 10px; background: var(--paper); }
  .dia-item .dia-meta { font-size:12px; color:var(--ink-soft); margin-bottom:8px; }
  .dia-item .estructura-mini { display:flex; justify-content:space-between; font-size:12.5px; padding: 4px 0; border-bottom:1px solid var(--line); }
  .dia-item .estructura-mini:last-child { border-bottom:none; }
  .dia-item .dia-actions { display:flex; gap:8px; margin-top:10px; }
  .dia-item .dia-actions button { flex:1; }

  section.panel { background: var(--paper-card); border: 1px solid var(--line); border-radius: var(--radius); }
  .panel-head { padding: 15px 18px 12px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .panel-head h2 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 17px; margin: 0; }
  .panel-head .count { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--ink-soft); }
  .panel-body { padding: 16px 18px 18px; }

  form.crear-assaig { display: grid; grid-template-columns: 1fr 1fr; gap: 9px 10px; margin-bottom: 16px; }
  form.crear-assaig .full { grid-column: 1 / -1; }
  label { display:block; font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); margin-bottom:4px; }
  input, select, textarea {
    width:100%; padding:8px 9px; border:1px solid var(--line); background:var(--paper); color:var(--ink);
    border-radius:var(--radius); font-family:'Work Sans',sans-serif; font-size:13.5px;

  button.primary:hover { background:#862432; }
  button.ghost { background: transparent; border:1px solid var(--ink); color: var(--ink); }
  button.ghost:hover { background: var(--ink); color: var(--paper-card); }
  button.small { padding: 6px 10px; font-size: 11px; }
  button:disabled { opacity:0.5; cursor:default; }

  ul.assajos-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  ul.assajos-list li {
    border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px;

  .preview-label { font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); margin-bottom:6px; }

  .preview-box img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
  .preview-box .p-box {
    position:absolute; transform: translate(-50%,-50%); display:flex; align-items:center; justify-content:center;

    font-family:'IBM Plex Mono',monospace; font-size: 9px; overflow:hidden; padding: 0 2px; color: var(--ink);
  }
  .preview-empty { display:flex; align-items:center; justify-content:center; height:100%; color: var(--ink-soft); font-size:12.5px; font-style:italic; text-align:center; padding: 20px; }

  .status-badge {
    font-family:'IBM Plex Mono',monospace; font-size:9.5px; text-transform:uppercase; letter-spacing:0.05em;
    padding: 2px 7px; border-radius: 20px; border: 1px solid var(--ink-soft); color: var(--ink-soft);

  .status-badge.publicado { border-color: var(--ok); color: var(--ok); }
  .empty-note { padding: 14px 0; text-align:center; color: var(--ink-soft); font-style: italic; font-size: 13px; }

  ul.attendance-list .m-name { font-weight: 500; }
  ul.attendance-list .m-meta { color: var(--ink-soft); font-size: 11.5px; margin-left: auto; }

  .gen-actions { display:flex; gap:10px; margin-top: 16px; flex-wrap: wrap; }

  /* modales */
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(32,36,31,0.55); align-items:flex-start; justify-content:center; padding:30px 20px; z-index:50; overflow-y:auto; }

  .prop-card .viab.no { color: var(--bad); }

  .prop-card .sugerencia .fila { margin-bottom: 4px; }
  .prop-card .sugerencia .lbl { font-family:'IBM Plex Mono',monospace; font-size:9.5px; text-transform:uppercase; color:var(--ink-soft); }

  .pinya-placeholder p { color: var(--ink-soft); max-width: 46ch; margin: 0 auto; font-size: 13.5px; }

<script>
// Guardia de sessió: si no has iniciat sessió, et redirigeix a /login.html.
// S'executa abans que la resta del contingut de la pàgina es carregui.
(function() {
  fetch('/api/auth/me').then(r => r.json()).then(data => {
    if (!data.usuario) {
      location.href = '/login.html';
      return;
    }
    window.usuarioActual = data.usuario;
    const chip = document.getElementById('user-chip');
    if (chip) {
      chip.style.cursor = 'pointer';
      chip.onclick = async () => {
        await fetch('/api/auth/logout', { method: 'POST' });
        location.href = '/login.html';
      };
    }
    document.documentElement.classList.add('sessio-confirmada');
    if (window.aplicarIdioma) window.aplicarIdioma(data.usuario.idioma || localStorage.getItem('castellers_idioma') || 'ca');
  }).catch(() => { location.href = '/login.html'; });
})();
</script>

let idiomaActual = localStorage.getItem('castellers_idioma') || 'ca';
function t(key) { return (TRADUCCIONES[idiomaActual] || TRADUCCIONES.ca)[key] || key; }

function aplicarIdioma(idioma) {
  idiomaActual = idioma;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    const val = t(key);
    if (val !== key) el.textContent = val;
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    const key = el.getAttribute('data-i18n-placeholder');
    const val = t(key);
    if (val !== key) el.placeholder = val;
  });
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === idioma));
  localStorage.setItem('castellers_idioma', idioma);
  document.documentElement.lang = idioma;
  const chip = document.getElementById('user-chip');
  if (chip && window.usuarioActual) chip.textContent = `${window.usuarioActual.nombre} · ${t('chip_tancar')}`;
  if (typeof renderEnsayosList === 'function') renderEnsayosList();
  if (typeof renderCalendario === 'function') renderCalendario();
}
window.aplicarIdioma = aplicarIdioma;

document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', async () => {
    aplicarIdioma(btn.dataset.lang);
    if (window.usuarioActual) {
      try {
        await fetch(`${API}/api/auth/idioma`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ idioma: btn.dataset.lang }) });
      } catch (err) { console.error(err); }
    }
  });
});
function formatFecha(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  const pad = n => String(n).padStart(2, '0');
  return `${pad(d.getUTCDate())}/${pad(d.getUTCMonth() + 1)}/${d.getUTCFullYear()}`;
}
function fechaISOSinHora(iso) {
  const d = new Date(iso);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`;
}

/* ---------------- Carga inicial ---------------- */

async function fetchEnsayos() {
  const list = document.getElementById('assajos-list');
  try {
    const res = await fetch(`${API}/api/ensayos`);
    const data = await res.json();
    ensayosList = data.data || [];
    document.getElementById('assajos-count').textContent = `${ensayosList.length} assaig${ensayosList.length === 1 ? '' : 's'}`;
    renderEnsayosList();
    renderCalendario();
  } catch (err) {
    list.innerHTML = '<li class="empty-note" style="border:none;">No s\'han pogut carregar els assajos.</li>';
    console.error(err);
  }
}

/* ---------------- Calendari ---------------- */

function renderCalendario() {
  document.getElementById('cal-mes-label').textContent = `${t('mesos')[calMonth]} ${calYear}`;
  const grid = document.getElementById('cal-grid');

  const primerDiaMes = new Date(Date.UTC(calYear, calMonth, 1));
  // getUTCDay(): 0=diumenge..6=dissabte: el convertim perquè dilluns sigui el primer
  const offset = (primerDiaMes.getUTCDay() + 6) % 7;
  const diasEnMes = new Date(Date.UTC(calYear, calMonth + 1, 0)).getUTCDate();
  const hoyISO = fechaISOSinHora(new Date().toISOString());

  const ensayosPorFecha = {};
  ensayosVisibles().forEach(e => {
    const key = fechaISOSinHora(e.fecha);
    if (!ensayosPorFecha[key]) ensayosPorFecha[key] = [];
    ensayosPorFecha[key].push(e);
  });

  const celdas = [];
  for (let i = 0; i < offset; i++) celdas.push({ dia: null });
  for (let d = 1; d <= diasEnMes; d++) {
    const pad = n => String(n).padStart(2, '0');
    const key = `${calYear}-${pad(calMonth + 1)}-${pad(d)}`;
    celdas.push({ dia: d, key, ensayos: ensayosPorFecha[key] || [] });
  }

  grid.innerHTML = celdas.map(c => {
    if (c.dia === null) return `<div class="cal-day otro-mes"></div>`;
    const tieneEnsayo = c.ensayos.length > 0;
    const esHoy = c.key === hoyISO;
    return `
      <div class="cal-day ${tieneEnsayo ? 'con-assaig' : ''} ${esHoy ? 'avui' : ''}" data-key="${c.key}">
        ${c.dia}
        ${tieneEnsayo ? '<span class="dot"></span>' : ''}
      </div>
    `;
  }).join('');

  grid.querySelectorAll('.cal-day.con-assaig').forEach(el => {
    el.addEventListener('click', () => mostrarDia(el.dataset.key, ensayosPorFecha[el.dataset.key]));
  });
}

document.getElementById('cal-prev').addEventListener('click', () => {
  calMonth--;
  if (calMonth < 0) { calMonth = 11; calYear--; }
  renderCalendario();
});
document.getElementById('cal-next').addEventListener('click', () => {
  calMonth++;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  renderCalendario();
});

const diaOverlay = document.getElementById('dia-overlay');
document.getElementById('close-dia').addEventListener('click', () => diaOverlay.classList.remove('open'));
diaOverlay.addEventListener('click', (e) => { if (e.target === diaOverlay) diaOverlay.classList.remove('open'); });

async function mostrarDia(key, ensayosDelDia) {
  const pad = n => String(n).padStart(2, '0');
  const [y, m, d] = key.split('-');
  document.getElementById('dia-titulo').textContent = `${d}/${m}/${y}`;
  const contenido = document.getElementById('dia-contenido');
  contenido.innerHTML = `<p class="empty-note">${t('carregant')}</p>`;
  diaOverlay.classList.add('open');

  const items = await Promise.all(ensayosDelDia.map(async (e) => {
    let estructuras = [];
    try {
      const res = await fetch(`${API}/api/ensayos/${e.id}/estructuras`);
      const data = await res.json();
      estructuras = data.data || [];
    } catch (err) { console.error(err); }
    return { ensayo: e, estructuras };
  }));

  contenido.innerHTML = items.map(({ ensayo, estructuras }) => `
    <div class="dia-item">
      <div class="dia-meta">
        ${ensayo.horaInicio ? escapeHtml(ensayo.horaInicio.slice(0,5)) + 'h · ' : ''}${t('assistent')(ensayo.numAsistentes)} ·
        <span class="status-badge ${ensayo.publicado ? 'publicado' : ''}">${ensayo.publicado ? t('publicat') : t('esborrany')}</span>
      </div>
      ${ensayo.notas ? `<div style="font-size:12.5px; margin-bottom:8px;">${escapeHtml(ensayo.notas)}</div>` : ''}
      ${estructuras.length
        ? estructuras.map(est => `
            <div class="estructura-mini">
              <span>${escapeHtml(est.tipo)}</span>
              <span>${est.posicionesAsignadas}/${est.totalPosiciones || '?'} ${t('posicions')}</span>
            </div>
          `).join('')
        : `<p class="empty-note" style="padding:8px 0;">${t('cap_castell_creat')}</p>`
      }
      <div class="dia-actions">
        <button class="ghost small veure-assaig-btn" data-id="${ensayo.id}" type="button">${t('veure_assaig')}</button>
      </div>
    </div>
  `).join('');

  contenido.querySelectorAll('.veure-assaig-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      diaOverlay.classList.remove('open');
      window.open(`/ensayo-detalle.html?id=${btn.dataset.id}`, '_blank');
    });
  });
}

function ensayosVisibles() {
  // Ara TOTS els assajos es veuen a la llista i al calendari (amb la marca
  // d'Esborrany/Publicat) — el que canvia és quant contingut es mostra en
  // obrir-los, no si es veuen que existeixen.
  return ensayosList;
}

function renderEnsayosList() {
  const list = document.getElementById('assajos-list');
  const visibles = ensayosVisibles();
  if (!visibles.length) {
    list.innerHTML = `<li class="empty-note" style="border:none;">${t('cap_assaig_creat')}</li>`;
    return;
  }
  list.innerHTML = visibles.map(e => `
    <li data-id="${e.id}">
      <span class="fecha-box">${formatFecha(e.fecha)}</span>
      <span class="meta">
        ${e.horaInicio ? escapeHtml(e.horaInicio.slice(0,5)) + 'h · ' : ''}${t('assistent')(e.numAsistentes)}
        <span class="status-badge ${e.publicado ? 'publicado' : ''}">${e.publicado ? t('publicat') : t('esborrany')}</span>
      </span>
      <button class="ghost small gestionar-btn" data-id="${e.id}" type="button">${t('gestionar')}</button>
    </li>
  `).join('');
}

document.getElementById('crear-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fecha = document.getElementById('fecha').value;
  const horaInicio = document.getElementById('horaInicio').value || null;
  const horaFin = document.getElementById('horaFin').value || null;
  const notas = document.getElementById('notas').value.trim() || null;
  if (!fecha) return;

  const btn = e.target.querySelector('button[type="submit"]');
  btn.disabled = true;
  try {
    const res = await fetch(`${API}/api/ensayos`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fecha, horaInicio, horaFin, notas })
    });
    const data = await res.json();
    if (!res.ok || !data.success) {
      throw new Error(data.error || `El servidor ha respost amb estat ${res.status}`);
    }
    e.target.reset();
    await fetchEnsayos();
  } catch (err) {
    console.error(err);
    alert(t('err_crear_assaig') + err.message);
  } finally {
    btn.disabled = false;
  }
});

document.getElementById('assajos-list').addEventListener('click', (e) => {
  const btn = e.target.closest('.gestionar-btn');
  if (!btn) return;
  window.open(`/ensayo-detalle.html?id=${btn.dataset.id}`, '_blank');
});

(async function init() {
  await fetchEnsayos();
})();
</script>
