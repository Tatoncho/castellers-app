<!DOCTYPE html>
<html lang="ca">
<head>
<style>html:not(.sessio-confirmada) body { visibility: hidden; }</style>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Castellers · Biblioteca d'imatges</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #EAE6DA; --paper-card: #F1EEE4; --ink: #20241F; --ink-soft: #4B5049;
    --thread: #9E2B3B; --gold: #B8893D; --line: #C7C2B0; --radius: 3px;
  }
  * { box-sizing: border-box; }
  body { margin:0; background: linear-gradient(var(--line) 1px, transparent 1px) 0 0/100% 34px, var(--paper); color:var(--ink); font-family:'Work Sans',sans-serif; font-size:14.5px; line-height:1.5; }
  a { color: var(--thread); }

  nav.topnav { display:flex; align-items:center; gap:22px; padding:18px 28px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  nav.topnav .brand { display:flex; align-items:center; gap:10px; font-family:'Fraunces',serif; font-weight:700; font-size:18px; text-decoration:none; color:var(--ink); font-variant:small-caps; }
  nav.topnav .links { display:flex; gap:4px; flex-wrap:wrap; }
  nav.topnav .links a { font-family:'IBM Plex Mono',monospace; font-size:12px; text-transform:uppercase; letter-spacing:0.04em; padding:8px 12px; border-radius:var(--radius); text-decoration:none; color:var(--ink-soft); border:1px solid transparent; }
  nav.topnav .links a:hover { border-color:var(--line); color:var(--ink); }
  nav.topnav .links a.active { color:var(--ink); border-color:var(--ink); }
  nav.topnav .spacer { margin-left:auto; }
  .lang-dropdown { position:relative; }
  .lang-dropdown-toggle { width:auto; margin:0; display:flex; align-items:center; gap:7px; background:var(--paper-card); border:1.5px solid var(--line); border-radius:var(--radius); padding:7px 10px; cursor:pointer; color:var(--ink); }
  .lang-dropdown-toggle:hover { border-color: var(--ink); }
  .lang-dropdown-toggle svg.lang-icon { flex-shrink:0; color: var(--ink-soft); }
  .lang-current-flag svg { display:block; border-radius:1px; }
  .lang-dropdown-menu { display:none; position:absolute; top:calc(100% + 6px); right:0; min-width:160px; background:var(--paper-card); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; box-shadow: 0 6px 16px rgba(32,36,31,0.18); z-index:60; }
  .lang-dropdown-menu.open { display:block; }
  .lang-btn { width:100%; margin:0; display:flex; align-items:center; gap:9px; background:none; border:none; padding:10px 12px; cursor:pointer; font-family:'Work Sans',sans-serif; font-size:13px; font-weight:400; text-transform:none; letter-spacing:0; color: var(--ink); text-align:left; }
  .lang-btn:hover { background: var(--paper); }
  .lang-btn.active { font-weight:600; background: var(--paper); }
  .lang-btn svg { display:block; border-radius:1px; flex-shrink:0; }
  .user-chip { font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); border:1px solid var(--line); padding:7px 11px; border-radius:var(--radius); cursor:pointer; background:none; }

  main { max-width: 1300px; margin: 0 auto; padding: 28px 28px 80px; display:grid; grid-template-columns: 260px 1fr; gap: 20px; align-items:start; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }

  section.panel { background: var(--paper-card); border: 1px solid var(--line); border-radius: var(--radius); }
  .panel-head { padding: 14px 18px 10px; border-bottom: 1px solid var(--line); }
  .panel-head h2 { font-family:'Fraunces',serif; font-weight:600; font-size:16px; margin:0; }
  .panel-body { padding: 16px 18px; }

  ul.categorias-list { list-style:none; margin:0 0 14px; padding:0; }
  ul.categorias-list li {
    display:flex; align-items:center; gap:8px; padding: 10px 12px; margin-bottom:6px;
    background: var(--paper); border:1px solid var(--line); border-radius: var(--radius); cursor:pointer;
  }
  ul.categorias-list li.active { border-color: var(--thread); background:#F3E7E5; }
  ul.categorias-list li .cat-nombre { font-family:'Fraunces',serif; font-weight:600; flex:1; }
  ul.categorias-list li .cat-count { font-family:'IBM Plex Mono',monospace; font-size:11px; color: var(--ink-soft); }
  ul.categorias-list li .cat-edit { background:transparent; border:none; color: var(--ink-soft); cursor:pointer; font-size:12px; padding:2px; }

  .add-cat-row { display:flex; gap:6px; }
  .add-cat-row input { flex:1; padding:8px 9px; border:1px solid var(--line); background:var(--paper); border-radius:var(--radius); }
  .add-cat-row button { width:auto; }

  .toolbar { display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
  .toolbar h2 { font-family:'Fraunces',serif; font-size:19px; margin:0; }
  .toolbar .spacer { flex:1; }
  .upload-label {
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; text-transform:uppercase; letter-spacing:0.04em;
    border: 1px solid var(--ink); padding: 9px 14px; border-radius: var(--radius); cursor:pointer;
  }
  .upload-label:hover { background: var(--ink); color: var(--paper-card); }

  .imagenes-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 14px; }
  .img-card { border:1px solid var(--line); border-radius: var(--radius); background: var(--paper); overflow:hidden; }
  .img-card img { width:100%; height:110px; object-fit:cover; display:block; background:#FDFCF8; }
  .img-card .img-card-body { padding: 8px 9px; }
  .img-card .img-nombre { font-size:12px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:6px; }
  .img-card .img-actions { display:flex; gap:6px; }
  .img-card button { flex:1; width:auto; padding: 5px 6px; font-size:10px; }

  button { cursor:pointer; border:none; border-radius:var(--radius); font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:0.04em; text-transform:uppercase; padding:9px 14px; }
  button.primary { background: var(--thread); color: var(--paper-card); width:100%; }
  button.primary:hover { background:#862432; }
  button.ghost { background: transparent; border:1px solid var(--ink); color: var(--ink); }
  button.ghost:hover { background: var(--ink); color: var(--paper-card); }
  .empty-note { color: var(--ink-soft); font-style: italic; padding: 20px 0; text-align:center; }
</style>
</head>
<body>

<nav class="topnav">
  <a class="brand" href="/">
    <svg width="26" height="26" viewBox="0 0 46 46" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect x="20" y="4" width="6" height="8" fill="#20241F"/><rect x="14" y="14" width="18" height="8" fill="#20241F"/>
      <rect x="8" y="26" width="30" height="8" fill="#20241F"/><rect x="2" y="38" width="42" height="6" fill="#9E2B3B"/>
    </svg>
    Castellers
  </a>
  <div class="links">
    <a href="/" data-i18n="nav_inici">Inici</a>
    <a href="/plantillas.html" data-i18n="nav_plantilles">Plantilles</a>
    <a href="/biblioteca-imagenes.html" class="active" data-i18n="nav_imatges">Imatges</a>
    <a href="/perfil.html" data-i18n="nav_perfil">El meu perfil</a>
  </div>
  <div class="spacer"></div>
  <div class="lang-dropdown">
    <button class="lang-dropdown-toggle" id="lang-dropdown-toggle" type="button" aria-label="Canviar idioma">
      <svg class="lang-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
        <circle cx="12" cy="12" r="9"/>
        <path d="M3 12h18"/>
        <path d="M12 3c2.8 2.6 4.3 5.7 4.3 9s-1.5 6.4-4.3 9c-2.8-2.6-4.3-5.7-4.3-9s1.5-6.4 4.3-9z"/>
      </svg>
      <span class="lang-current-flag" id="lang-current-flag"></span>
      <svg width="9" height="9" viewBox="0 0 10 6" fill="none"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.6"/></svg>
    </button>
    <div class="lang-dropdown-menu" id="lang-dropdown-menu">
      <button class="lang-btn" data-lang="ca" type="button">
        <svg width="20" height="14" viewBox="0 0 20 14"><rect width="20" height="14" fill="#FFCE00"/><rect y="0" width="20" height="2" fill="#DA121A"/><rect y="4" width="20" height="2" fill="#DA121A"/><rect y="8" width="20" height="2" fill="#DA121A"/><rect y="12" width="20" height="2" fill="#DA121A"/></svg>
        Català
      </button>
      <button class="lang-btn" data-lang="es" type="button">
        <svg width="20" height="14" viewBox="0 0 20 14"><rect width="20" height="14" fill="#AA151B"/><rect y="3.5" width="20" height="7" fill="#F1BF00"/></svg>
        Español
      </button>
      <button class="lang-btn" data-lang="en" type="button">
        <svg width="20" height="14" viewBox="0 0 20 14">
          <rect width="20" height="14" fill="#00247D"/>
          <path d="M0,0 L20,14 M20,0 L0,14" stroke="#FFFFFF" stroke-width="2.6"/>
          <path d="M0,0 L20,14 M20,0 L0,14" stroke="#CF142B" stroke-width="1.1"/>
          <path d="M10,0 V14 M0,7 H20" stroke="#FFFFFF" stroke-width="4.4"/>
          <path d="M10,0 V14 M0,7 H20" stroke="#CF142B" stroke-width="2.4"/>
        </svg>
        English
      </button>
    </div>
  </div>
  <span class="user-chip" id="user-chip">…</span>
</nav>
<script>
const API = '';
let categorias = [];
let categoriaActual = null;
let usuarioActual = null;

const FLAGS_SVG = {
  ca: '<svg width="18" height="13" viewBox="0 0 20 14"><rect width="20" height="14" fill="#FFCE00"/><rect y="0" width="20" height="2" fill="#DA121A"/><rect y="4" width="20" height="2" fill="#DA121A"/><rect y="8" width="20" height="2" fill="#DA121A"/><rect y="12" width="20" height="2" fill="#DA121A"/></svg>',
  es: '<svg width="18" height="13" viewBox="0 0 20 14"><rect width="20" height="14" fill="#AA151B"/><rect y="3.5" width="20" height="7" fill="#F1BF00"/></svg>',
  en: '<svg width="18" height="13" viewBox="0 0 20 14"><rect width="20" height="14" fill="#00247D"/><path d="M0,0 L20,14 M20,0 L0,14" stroke="#FFFFFF" stroke-width="2.6"/><path d="M0,0 L20,14 M20,0 L0,14" stroke="#CF142B" stroke-width="1.1"/><path d="M10,0 V14 M0,7 H20" stroke="#FFFFFF" stroke-width="4.4"/><path d="M10,0 V14 M0,7 H20" stroke="#CF142B" stroke-width="2.4"/></svg>'
};
const TRADUCCIONES = {
  ca: {
    nav_inici: 'Inici', nav_perfil: 'El meu perfil', nav_plantilles: 'Plantilles', nav_imatges: 'Imatges', chip_tancar: 'Tancar sessió',
    categories: 'Categories', placeholder_nueva_cat: 'Nova categoria…', pujar_imatge: '+ Pujar imatge',
    renombrar_cat: 'Renombrar', prompt_nombre_cat: 'Nou nom de la categoria:', err_renombrar: 'No s\'ha pogut renombrar: ',
    sense_categories: 'Sense categories', no_carregat: 'No s\'han pogut carregar.', err_crear: 'No s\'ha pogut crear: ',
    crea_primer_cat: 'Crea primer una categoria.', carregant: 'Carregant…', sense_imagenes: 'Encara no hi ha imatges en aquesta categoria.',
    sense_nom: 'Sense nom', btn_renombrar: 'Renombrar', btn_eliminar: 'Eliminar',
    prompt_nombre_img: 'Nou nom de la imatge:', confirm_eliminar_img: 'Vols eliminar aquesta imatge?',
    resumen_pujades: (n) => `${n} imatge${n === 1 ? '' : 's'} pujada${n === 1 ? '' : 's'}.`,
    resumen_omesas: (n, cat) => `${n} omesa${n === 1 ? '' : 's'} perquè ja existia${n === 1 ? '' : 'n'} amb aquest nom a "${cat}":`
  },
  es: {
    nav_inici: 'Inicio', nav_perfil: 'Mi perfil', nav_plantilles: 'Plantillas', nav_imatges: 'Imágenes', chip_tancar: 'Cerrar sesión',
    categories: 'Categorías', placeholder_nueva_cat: 'Nueva categoría…', pujar_imatge: '+ Subir imagen',
    renombrar_cat: 'Renombrar', prompt_nombre_cat: 'Nuevo nombre de la categoría:', err_renombrar: 'No se ha podido renombrar: ',
    sense_categories: 'Sin categorías', no_carregat: 'No se han podido cargar.', err_crear: 'No se ha podido crear: ',
    crea_primer_cat: 'Crea primero una categoría.', carregant: 'Cargando…', sense_imagenes: 'Aún no hay imágenes en esta categoría.',
    sense_nom: 'Sin nombre', btn_renombrar: 'Renombrar', btn_eliminar: 'Eliminar',
    prompt_nombre_img: 'Nuevo nombre de la imagen:', confirm_eliminar_img: '¿Quieres eliminar esta imagen?',
    resumen_pujades: (n) => `${n} imagen${n === 1 ? '' : 'es'} subida${n === 1 ? '' : 's'}.`,
    resumen_omesas: (n, cat) => `${n} omitida${n === 1 ? '' : 's'} porque ya existía${n === 1 ? '' : 'n'} con ese nombre en "${cat}":`
  },
  en: {
    nav_inici: 'Home', nav_perfil: 'My profile', nav_plantilles: 'Templates', nav_imatges: 'Images', chip_tancar: 'Log out',
    categories: 'Categories', placeholder_nueva_cat: 'New category…', pujar_imatge: '+ Upload image',
    renombrar_cat: 'Rename', prompt_nombre_cat: 'New category name:', err_renombrar: 'Could not rename: ',
    sense_categories: 'No categories', no_carregat: 'Could not load.', err_crear: 'Could not create: ',
    crea_primer_cat: 'Create a category first.', carregant: 'Loading…', sense_imagenes: 'No images in this category yet.',
    sense_nom: 'No name', btn_renombrar: 'Rename', btn_eliminar: 'Delete',
    prompt_nombre_img: 'New image name:', confirm_eliminar_img: 'Delete this image?',
    resumen_pujades: (n) => `${n} image${n === 1 ? '' : 's'} uploaded.`,
    resumen_omesas: (n, cat) => `${n} skipped because ${n === 1 ? 'it' : 'they'} already existed with that name in "${cat}":`
  }
};
let idiomaActual = localStorage.getItem('castellers_idioma') || 'ca';
function t(key) { return (TRADUCCIONES[idiomaActual] || TRADUCCIONES.ca)[key] || key; }

function aplicarIdioma(idioma) {
  idiomaActual = idioma;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    const val = t(key);
    if (val !== key) el.textContent = val;
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    const key = el.getAttribute('data-i18n-placeholder');
    const val = t(key);
    if (val !== key) el.placeholder = val;
  });
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === idioma));
  document.getElementById('lang-current-flag').innerHTML = FLAGS_SVG[idioma] || FLAGS_SVG.ca;
  document.getElementById('lang-dropdown-menu').classList.remove('open');
  localStorage.setItem('castellers_idioma', idioma);
  document.documentElement.lang = idioma;
  const chip = document.getElementById('user-chip');
  if (chip && usuarioActual) chip.textContent = `${usuarioActual.nombre} · ${t('chip_tancar')}`;
  cargarCategorias();
  cargarImagenes();
}

const langDropdownToggle = document.getElementById('lang-dropdown-toggle');
const langDropdownMenu = document.getElementById('lang-dropdown-menu');
langDropdownToggle.addEventListener('click', (e) => {
  e.stopPropagation();
  langDropdownMenu.classList.toggle('open');
});
document.addEventListener('click', () => langDropdownMenu.classList.remove('open'));
langDropdownMenu.addEventListener('click', (e) => e.stopPropagation());

document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', async () => {
    aplicarIdioma(btn.dataset.lang);
    if (usuarioActual) {
      try {
        await fetch(`${API}/api/auth/idioma`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ idioma: btn.dataset.lang }) });
      } catch (err) { console.error(err); }
    }
  });
});

// Guardia de sessió: si no has iniciat sessió, et redirigeix a /login.html.
(function() {
  fetch('/api/auth/me').then(r => r.json()).then(data => {
    if (!data.usuario) {
      location.href = '/login.html';
      return;
    }
    usuarioActual = data.usuario;
    window.usuarioActual = data.usuario;
    const chip = document.getElementById('user-chip');
    if (chip) {
      chip.style.cursor = 'pointer';
      chip.onclick = async () => {
        await fetch('/api/auth/logout', { method: 'POST' });
        location.href = '/login.html';
      };
    }
    document.documentElement.classList.add('sessio-confirmada');
    idiomaActual = data.usuario.idioma || idiomaActual;
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      const val = t(key);
      if (val !== key) el.textContent = val;
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
      const key = el.getAttribute('data-i18n-placeholder');
      const val = t(key);
      if (val !== key) el.placeholder = val;
    });
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === idiomaActual));
    localStorage.setItem('castellers_idioma', idiomaActual);
    document.documentElement.lang = idiomaActual;
    chip.textContent = `${usuarioActual.nombre} · ${t('chip_tancar')}`;
  }).catch(() => { location.href = '/login.html'; });
})();

function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}
</script>

<main>
  <section class="panel">
    <div class="panel-head"><h2 data-i18n="categories">Categories</h2></div>
    <div class="panel-body">
      <ul class="categorias-list" id="categorias-list"></ul>
      <div class="add-cat-row">
        <input type="text" id="nueva-categoria-input" placeholder="Nova categoria…" data-i18n-placeholder="placeholder_nueva_cat">
        <button class="ghost" id="add-categoria-btn" type="button">+</button>
      </div>
    </div>
  </section>

  <section class="panel">
    <div class="panel-body">
      <div class="toolbar">
        <h2 id="categoria-titulo">—</h2>
        <div class="spacer"></div>
        <label class="upload-label" for="upload-input" data-i18n="pujar_imatge">+ Pujar imatge</label>
        <input type="file" id="upload-input" accept="image/*" multiple style="display:none;">
      </div>
      <div class="imagenes-grid" id="imagenes-grid"></div>
    </div>
  </section>
</main>

<script>
async function cargarCategorias() {
  const list = document.getElementById('categorias-list');
  try {
    const res = await fetch(`${API}/api/categorias-imagen`);
    const data = await res.json();
    categorias = data.data || [];
    if (!categoriaActual && categorias.length) categoriaActual = categorias[0].nombre;

    list.innerHTML = categorias.map(c => `
      <li class="${c.nombre === categoriaActual ? 'active' : ''}" data-nombre="${escapeHtml(c.nombre)}" data-id="${c.id}">
        <span class="cat-nombre">${escapeHtml(c.nombre)}</span>
        <span class="cat-count">${c.numImagenes}</span>
        <button class="cat-edit" data-id="${c.id}" data-nombre="${escapeHtml(c.nombre)}" type="button" title="${t('renombrar_cat')}">✎</button>
      </li>
    `).join('');

    list.querySelectorAll('li').forEach(li => {
      li.addEventListener('click', (e) => {
        if (e.target.closest('.cat-edit')) return;
        categoriaActual = li.dataset.nombre;
        cargarCategorias();
        cargarImagenes();
      });
    });
    list.querySelectorAll('.cat-edit').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const nuevoNombre = prompt(t('prompt_nombre_cat'), btn.dataset.nombre);
        if (!nuevoNombre || !nuevoNombre.trim() || nuevoNombre.trim() === btn.dataset.nombre) return;
        try {
          const res = await fetch(`${API}/api/categorias-imagen/${btn.dataset.id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nombre: nuevoNombre.trim() })
          });
          const data = await res.json();
          if (!res.ok || !data.success) throw new Error(data.error || 'Error');
          if (categoriaActual === btn.dataset.nombre) categoriaActual = nuevoNombre.trim();
          await cargarCategorias();
          await cargarImagenes();
        } catch (err) {
          alert(t('err_renombrar') + err.message);
        }
      });
    });

    document.getElementById('categoria-titulo').textContent = categoriaActual || t('sense_categories');
  } catch (err) {
    console.error(err);
    list.innerHTML = `<li class="empty-note">${t('no_carregat')}</li>`;
  }
}

document.getElementById('add-categoria-btn').addEventListener('click', async () => {
  const input = document.getElementById('nueva-categoria-input');
  const nombre = input.value.trim();
  if (!nombre) return;
  try {
    const res = await fetch(`${API}/api/categorias-imagen`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nombre })
    });
    const data = await res.json();
    if (!res.ok || !data.success) throw new Error(data.error || 'Error');
    input.value = '';
    categoriaActual = nombre;
    await cargarCategorias();
    await cargarImagenes();
  } catch (err) {
    alert(t('err_crear') + err.message);
  }
});

let imagenesActuales = [];

async function cargarImagenes() {
  const grid = document.getElementById('imagenes-grid');
  if (!categoriaActual) { grid.innerHTML = `<p class="empty-note">${t('crea_primer_cat')}</p>`; return; }
  grid.innerHTML = `<p class="empty-note">${t('carregant')}</p>`;
  try {
    const res = await fetch(`${API}/api/imagenes?categoria=${encodeURIComponent(categoriaActual)}`);
    const data = await res.json();
    const imgs = data.data || [];
    imagenesActuales = imgs;
    if (!imgs.length) { grid.innerHTML = `<p class="empty-note">${t('sense_imagenes')}</p>`; return; }

    grid.innerHTML = imgs.map(img => `
      <div class="img-card" data-id="${img.id}">
        <img src="${img.dataUrl}" alt="">
        <div class="img-card-body">
          <div class="img-nombre">${escapeHtml(img.nombre || t('sense_nom'))}</div>
          <div class="img-actions">
            <button class="ghost rename-btn" data-id="${img.id}" data-nombre="${escapeHtml(img.nombre || '')}" type="button">${t('btn_renombrar')}</button>
            <button class="ghost del-btn" data-id="${img.id}" type="button">${t('btn_eliminar')}</button>
          </div>
        </div>
      </div>
    `).join('');

    grid.querySelectorAll('.rename-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const nuevo = prompt(t('prompt_nombre_img'), btn.dataset.nombre);
        if (nuevo === null || !nuevo.trim()) return;
        try {
          await fetch(`${API}/api/imagenes/${btn.dataset.id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nombre: nuevo.trim() })
          });
          cargarImagenes();
        } catch (err) { console.error(err); }
      });
    });
    grid.querySelectorAll('.del-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm(t('confirm_eliminar_img'))) return;
        try {
          await fetch(`${API}/api/imagenes/${btn.dataset.id}`, { method: 'DELETE' });
          cargarImagenes();
          cargarCategorias();
        } catch (err) { console.error(err); }
      });
    });
  } catch (err) {
    console.error(err);
    grid.innerHTML = `<p class="empty-note">${t('no_carregat')}</p>`;
  }
}

function leerComoDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (ev) => resolve(ev.target.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

document.getElementById('upload-input').addEventListener('change', async (e) => {
  const files = [...e.target.files];
  if (!files.length || !categoriaActual) return;

  // noms ja existents en aquesta categoria (incloent els que anem pujant
  // en aquesta mateixa tanda, per no permetre duplicats entre ells tampoc)
  const nombresExistentes = new Set(imagenesActuales.map(img => img.nombre));

  let pujades = 0;
  const omitidas = [];

  for (const file of files) {
    if (nombresExistentes.has(file.name)) {
      omitidas.push(file.name);
      continue;
    }
    try {
      const dataUrl = await leerComoDataURL(file);
      await fetch(`${API}/api/imagenes`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nombre: file.name, categoria: categoriaActual, dataUrl })
      });
      nombresExistentes.add(file.name);
      pujades++;
    } catch (err) {
      console.error(err);
      omitidas.push(file.name + ' (error)');
    }
  }

  await cargarImagenes();
  await cargarCategorias();

  if (omitidas.length) {
    alert(
      `${t('resumen_pujades')(pujades)}\n` +
      `${t('resumen_omesas')(omitidas.length, categoriaActual)}\n` +
      omitidas.join('\n')
    );
  }

  e.target.value = '';
});

(async function init() {
  await cargarCategorias();
  await cargarImagenes();
})();
</script>
